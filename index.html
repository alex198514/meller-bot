<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="description" content="Meller Bot: daily 20-day breakout signals on 75 crypto coins, paper trading and prop challenge progress.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meller Bot">
  <link rel="manifest" href="manifest.json?v=7">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Meller Bot</title>
  <link rel="stylesheet" href="style.css?v=7">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="" class="logo">
      <div class="brand-text">
        <div class="title">Meller Bot</div>
        <div class="status" id="status">…</div>
      </div>
    </div>
    <div class="top-right">
      <span class="pill" id="market"></span>
      <button class="lang" id="lang" type="button" aria-label="Language">EN</button>
    </div>
  </header>

  <main id="main">
    <section class="tab" id="tab-market">
      <input id="search" type="search" autocomplete="off" spellcheck="false">
      <div class="list-head">
        <h2 id="near-title"></h2>
        <button class="info" id="near-info" type="button" aria-expanded="false" aria-controls="near-explain">i</button>
      </div>
      <p class="explain" id="near-explain" hidden></p>
      <ul class="list" id="coins"></ul>
      <button class="more" id="more" type="button" hidden></button>
    </section>

    <section class="tab" id="tab-signal" hidden>
      <div class="card hero" id="sig-hero"></div>
      <div class="card ladder-card" id="ladder"></div>
      <div class="tps" id="tps"></div>
      <p class="sentence" id="sig-status"></p>
      <div class="card chart-card"><div class="chart" id="chart"></div></div>
    </section>

    <section class="tab" id="tab-positions" hidden>
      <div id="positions"></div>
    </section>

    <section class="tab" id="tab-challenge" hidden>
      <div id="challenges"></div>
      <h2 class="h2" id="curve-title"></h2>
      <div class="card chart-card" id="curve-card"><div class="chart small" id="curve"></div></div>
      <p class="hint" id="curve-hint"></p>
      <h2 class="h2" id="history-title"></h2>
      <ul class="history" id="history"></ul>
    </section>

    <footer class="foot">built with Claude Code · @meller_ai · not financial advice</footer>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="market" class="active" type="button">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M3 19V14.5l5-5 4 4 7-7.5V19z"/><path class="ln" d="M3 14.5l5-5 4 4 7-7.5"/></svg></span>
      <span data-t="tab_market"></span>
    </button>
    <button data-tab="signal" type="button">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 8h4v9H4zM10 5h4v10h-4zM16 10h4v8h-4z"/><path class="ln" d="M6 5v15M12 3v15M18 7v14"/></svg></span>
      <span data-t="tab_signal"></span>
    </button>
    <button data-tab="positions" type="button">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M3.5 8h17v11.5h-17z"/><path class="ln" d="M9 8V5.5h6V8M3.5 13h17"/></svg></span>
      <span data-t="tab_positions"></span>
    </button>
    <button data-tab="challenge" type="button">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z"/><path class="ln" d="M12 14v4M8 20.5h8M16.5 5.5h3v1.5a3.5 3.5 0 0 1-3.5 3.5M7.5 5.5h-3v1.5A3.5 3.5 0 0 0 8 10.5"/></svg></span>
      <span data-t="tab_challenge"></span>
    </button>
  </nav>

  <script src="app.js?v=7"></script>
</body>
</html>
