<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121722">
  <meta name="description" content="Meller Bot: daily 20-day breakout signals on 75 crypto coins, paper trading and prop challenge progress.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meller Bot">
  <link rel="manifest" href="manifest.json?v=3">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Meller Bot</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="" class="logo">
      <div>
        <div class="title">Meller Bot</div>
        <div class="status" id="status">…</div>
      </div>
    </div>
    <div class="top-right">
      <span class="chip" id="market"></span>
      <button class="lang" id="lang" type="button" aria-label="Language">EN</button>
    </div>
  </header>

  <main id="main">
    <section class="tab" id="tab-market">
      <div class="search-wrap">
        <input id="search" type="search" autocomplete="off" spellcheck="false">
      </div>
      <div class="list-head">
        <h2 id="near-title"></h2>
        <button class="info" id="near-info" type="button" aria-expanded="false" aria-controls="near-explain">i</button>
      </div>
      <p class="explain" id="near-explain" hidden></p>
      <ul class="list" id="coins"></ul>
      <button class="more" id="more" type="button" hidden></button>
    </section>

    <section class="tab" id="tab-signal" hidden>
      <div class="coin-head">
        <select id="coin-select" aria-label="Coin"></select>
        <div class="coin-price"><span id="sig-price"></span> <span id="sig-change" class="pct"></span></div>
      </div>
      <div class="sig-box" id="sig-box"></div>
      <div class="chart" id="chart"></div>
      <p class="sentence" id="sig-status"></p>
    </section>

    <section class="tab" id="tab-positions" hidden>
      <div id="positions"></div>
    </section>

    <section class="tab" id="tab-challenge" hidden>
      <div id="challenges"></div>
      <h2 class="h2" id="curve-title"></h2>
      <div class="chart small" id="curve"></div>
      <p class="hint" id="curve-hint"></p>
      <h2 class="h2" id="history-title"></h2>
      <ul class="history" id="history"></ul>
    </section>

    <footer class="foot">built with Claude Code · @meller_ai · not financial advice</footer>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="market" class="active" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8M14 8h6v6"/></svg><span data-t="tab_market"></span>
    </button>
    <button data-tab="signal" type="button">
      <svg viewBox="0 0 24 24"><path d="M6 4v16M6 8h-2v8h2M14 6v14M14 9h-2v7h2M20 3v18M20 6h-2v6h2"/></svg><span data-t="tab_signal"></span>
    </button>
    <button data-tab="positions" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM9 7V5h6v2"/></svg><span data-t="tab_positions"></span>
    </button>
    <button data-tab="challenge" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M8 20h8M16 5h3v2a3 3 0 0 1-3 3M8 5H5v2a3 3 0 0 0 3 3"/></svg><span data-t="tab_challenge"></span>
    </button>
  </nav>

  <script src="app.js?v=3"></script>
</body>
</html>
